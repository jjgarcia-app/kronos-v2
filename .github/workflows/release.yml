name: Release

on:
  push:
    tags:
      - 'v*'
  # Permite republicar un tag viejo sin recrearlo: los assets de goreleaser solo
  # se generan cuando se pushea el tag, así que si varios tags se pushean juntos
  # (o el run falla), la versión queda sin sus tarballs. Con esto:
  #   gh workflow run release.yml --ref main -f tag=v2.18.14
  # El input es necesario porque GitHub toma el workflow del ref elegido: al
  # disparar sobre main hay que decirle qué tag construir, y el checkout de abajo
  # hace el checkout de ese tag, no el de main.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (ej. v2.18.14)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # En un push de tag, github.ref ya es el tag. En un disparo manual sobre
          # main, el input `tag` es el que manda.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
