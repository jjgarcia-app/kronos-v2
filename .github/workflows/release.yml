name: Release

on:
  push:
    tags:
      - 'v*'
  # Permite republicar un tag viejo sin recrearlo: los assets de goreleaser solo
  # se generan cuando se pushea el tag, así que si varios tags se pushean juntos
  # (o el run falla), la versión queda sin sus tarballs. Con esto:
  #   gh workflow run release.yml --ref v2.18.14
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (se usa el ref elegido al disparar)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
